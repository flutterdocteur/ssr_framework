name: ssr_example
description: Example application using SSR Framework
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  ssr_core:
    path: ../ssr_core
  ssr_server:
    path: ../ssr_server
  ssr_client:
    path: ../ssr_client
